name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          MODEL_PATH: ml/saved_model/model.joblib
          LOG_LEVEL: INFO
          MAX_BATCH_SIZE: "100"
          API_TITLE: Customer Churn Prediction API
          API_KEY: supersecretkey123
          ALLOWED_ORIGINS: http://localhost:3000
        run: pytest tests/test_health.py tests/test_predict.py tests/test_predict_batch.py tests/test_model_info.py tests/test_v2_predict.py tests/test_security.py -v